<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mes Voyages</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="accueil">

        <!-- =========================================
             VOYAGE ACTUEL / PROCHAIN
        ========================================== -->

        <section
            id="prochainVoyage"
            class="prochain-voyage"
        >

            <!-- Photo du voyage -->

            <img
                id="photoProchainVoyage"
                class="photo-voyage"
                src=""
                alt=""
                hidden
            >


            <!-- Pays / ville / date -->

            <div
                id="infosProchainVoyage"
                class="infos-prochain-voyage"
                hidden
            >

                <div class="info-voyage">

                    <span id="infoPays"></span>

                </div>


                <div class="info-voyage">

                    <span id="infoVille"></span>

                </div>


                <div class="info-voyage">

                    <span id="infoDate"></span>

                </div>

            </div>

        </section>


        <!-- =========================================
             ZONE CLIC MES VOYAGES
        ========================================== -->

        <a
            href="mes-voyages.html"
            class="zone-clic zone-voyages"
        ></a>


        <!-- =========================================
             ZONE CLIC AJOUTER
        ========================================== -->

        <a
            href="ajouter.html"
            class="zone-clic zone-ajouter"
        ></a>

    </main>


    <script src="script.js"></script>

</body>

</html>
