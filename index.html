<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochain Voyage - PWA</title>
  <style>
    :root {
      --bg-color: #1c3237;
      --card-bg: #f5eedc;
      --text-color: #2b2b2b;
      --btn-green: #255859;
      --btn-beige: #e5d7be;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .title {
      color: #f5eedc;
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    /* Carte Style Polaroid */
    .polaroid {
      background: var(--card-bg);
      padding: 16px 16px 24px 16px;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transform: rotate(-1.5deg);
      margin-bottom: 30px;
    }

    .polaroid img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 2px;
    }

    .trip-info {
      margin-top: 16px;
      text-align: left;
      font-family: sans-serif;
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Boutons de navigation */
    .btn {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease, filter 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--btn-green);
      color: #ffffff;
    }

    .btn-secondary {
      background-color: var(--btn-beige);
      color: var(--text-color);
      border-color: #c3b195;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="title">Prochain voyage</div>

  <!-- Polaroid dynamique -->
  <div class="polaroid">
    <img id="trip-image" src="" alt="Photo du voyage">
    <div class="trip-info">
      <div class="info-row">📍 <span id="trip-country">---</span></div>
      <div class="info-row">🚩 <span id="trip-city">---</span></div>
      <div class="info-row">📅 <span id="trip-date">---</span></div>
    </div>
  </div>

  <!-- Boutons cliquables -->
  <button class="btn btn-primary" onclick="goTo('mes-voyages.html')">
    📖 MES VOYAGES
  </button>

  <button class="btn btn-secondary" onclick="goTo('ajouter-voyage.html')">
    ➕ AJOUTER UN VOYAGE
  </button>
</div>

<script>
  // Données dynamiques du voyage (pouvant venir de LocalStorage ou d'une API)
  const prochainVoyage = {
    pays: "Japon",
    ville: "Tokyo et Kyoto",
    date: "20 avril 2026",
    imageUrl: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=800"
  };

  // Mettre à jour l'affichage dynamique
  function chargerVoyage(data) {
    document.getElementById("trip-image").src = data.imageUrl;
    document.getElementById("trip-country").textContent = data.pays;
    document.getElementById("trip-city").textContent = data.ville;
    document.getElementById("trip-date").textContent = data.date;
  }

  // Redirection des boutons
  function goTo(page) {
    window.location.href = page;
  }

  // Charger les données au démarrage
  chargerVoyage(prochainVoyage);
</script>

</body>
</html>
